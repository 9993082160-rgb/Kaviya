{% extends "base.html" %}

{% block title %}Jewelry Advisor | PocketSmart AI{% endblock %}

{% block content %}

<section class="page-header">

    <span class="badge">Jewelry Advisor</span>

    <h1>Find jewelry within your budget</h1>

    <p>
        Tell us about your occasion and preferences.
        You can also upload an image for AI-assisted recommendations.
    </p>

</section>


<section class="planner-card">

    <form id="jewelry-form" enctype="multipart/form-data">

        <label for="budget">Budget (₹)</label>

        <input
            type="number"
            id="budget"
            name="budget"
            min="1"
            placeholder="Example: 50000"
            required
        >


        <label for="occasion">Occasion</label>

        <select id="occasion" name="occasion" required>

            <option value="">Select occasion</option>
            <option value="Wedding">Wedding</option>
            <option value="Birthday">Birthday</option>
            <option value="Anniversary">Anniversary</option>
            <option value="Festival">Festival</option>
            <option value="Everyday">Everyday Wear</option>

        </select>


        <label for="jewelry_type">Jewelry Type</label>

        <select id="jewelry_type" name="jewelry_type" required>

            <option value="">Select type</option>
            <option value="Necklace">Necklace</option>
            <option value="Earrings">Earrings</option>
            <option value="Bracelet">Bracelet</option>
            <option value="Ring">Ring</option>
            <option value="Bangle">Bangle</option>

        </select>


        <label for="metal">Preferred Metal</label>

        <select id="metal" name="metal">

            <option value="">Any metal</option>
            <option value="Gold">Gold</option>
            <option value="Silver">Silver</option>
            <option value="Diamond">Diamond</option>

        </select>


        <label for="image">
            Upload Jewelry Image (optional)
        </label>

        <input
            type="file"
            id="image"
            name="image"
            accept="image/png,image/jpeg,image/webp"
        >


        <button
            type="submit"
            class="btn btn-primary btn-full"
        >
            Get Jewelry Recommendation
        </button>

    </form>

</section>


<section id="recommendation-result" class="result-section">

</section>

{% endblock %}
