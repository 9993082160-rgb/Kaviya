{% extends "base.html" %}

{% block title %}Login | PocketSmart AI{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <span class="badge">Welcome Back</span>

        <h1>Login to PocketSmart AI</h1>

        <p>
            Access your budget planners and recommendation history.
        </p>

        <form id="login-form">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Your password"
                required
            >


            <button
                type="submit"
                class="btn btn-primary btn-full"
            >
                Login
            </button>

        </form>

        <div id="form-message" class="form-message"></div>

        <p class="auth-footer">
            Don't have an account?
            <a href="/register">Create one</a>
        </p>

    </div>

</section>

{% endblock %}
