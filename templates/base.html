<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PocketSmart AI{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">
        <div class="container nav-content">

            <a href="/" class="brand">
                PocketSmart AI
            </a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/home-planner">Home Planner</a>
                <a href="/party-planner">Party Planner</a>
                <a href="/jewelry-planner">Jewelry</a>
                <a href="/shopping">Shopping & Product Discovery</a>
                <a href="/history">History</a>
            </div>

        </div>
    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">
        <div class="container">
            <p>
                © 2026 PocketSmart AI — Smart Budget & Recommendation Assistant
            </p>
        </div>
    </footer>


    <script src="{{ url_for('static', path='js/app.js') }}"></script>

</body>
</html>
